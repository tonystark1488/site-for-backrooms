<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backrooms</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
    height:100vh;
    color:#f5e8a3;
}

/* glow */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(120,100,20,0.15),
    transparent 60%);
}

/* scanlines */
body::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.03),
        transparent
    );
    background-size:100% 4px;
    pointer-events:none;
}

/* corridor */
.corridor{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* left walls */
.wall-left{
    position:absolute;
    bottom:0;
    left:0;
    width:40%;
    height:100%;
    background:linear-gradient(
        to right,
        rgba(255,245,180,0.55),
        rgba(70,60,20,0.35),
        black
    );
    clip-path:polygon(0 0,100% 18%,100% 100%,0 100%);
}

/* right walls */
.wall-right{
    position:absolute;
    bottom:0;
    right:0;
    width:40%;
    height:100%;
    background:linear-gradient(
        to left,
        rgba(255,245,180,0.55),
        rgba(70,60,20,0.35),
        black
    );
    clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);
}

/* center void */
.void{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:350px;
    height:350px;
    border-radius:50%;
    background:black;
    filter:blur(50px);
    opacity:0.95;
}

/* extra depth layers */
.depth-left,
.depth-right{
    position:absolute;
    bottom:0;
    width:22%;
    height:75%;
    opacity:0.45;
}

.depth-left{
    left:18%;
    background:linear-gradient(
        to right,
        rgba(255,245,180,0.2),
        transparent
    );
    clip-path:polygon(0 0,100% 22%,100% 100%,0 100%);
}

.depth-right{
    right:18%;
    background:linear-gradient(
        to left,
        rgba(255,245,180,0.2),
        transparent
    );
    clip-path:polygon(0 22%,100% 0,100% 100%,0 100%);
}

/* center content */
.center{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.subtitle{
    letter-spacing:8px;
    color:rgba(255,255,200,0.28);
    margin-bottom:22px;
    font-size:12px;
}

.title{
    font-size:92px;
    letter-spacing:22px;
    font-weight:900;
    text-shadow:0 0 25px rgba(255,240,120,0.18);
}

.download{
    margin-top:24px;
    color:rgba(255,255,200,0.55);
    letter-spacing:6px;
    font-size:15px;
}

.button{
    margin-top:42px;
}

.button a{
    text-decoration:none;
    color:#f5e8a3;
    border:1px solid rgba(255,255,200,0.18);
    padding:20px 48px;
    border-radius:999px;
    background:rgba(255,255,180,0.05);
    letter-spacing:5px;
    transition:0.35s;
    display:inline-block;
    backdrop-filter:blur(6px);
}

.button a:hover{
    transform:scale(1.05);
    background:rgba(255,255,180,0.1);
    box-shadow:0 0 35px rgba(255,240,120,0.12);
}

.bottom{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:rgba(255,255,200,0.16);
    letter-spacing:5px;
    font-size:11px;
    z-index:5;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

.footer-links {
    display: flex;
    gap: 20px;
}

.tos-link {
    color: rgba(255,255,200,0.4);
    text-decoration: none;
    font-size: 10px;
    transition: 0.3s;
}

.tos-link:hover {
    color: #f5e8a3;
    text-shadow: 0 0 10px rgba(255,240,120,0.5);
}

/* mobile */
@media(max-width:700px){
.title{ font-size:48px; letter-spacing:10px; }
.download{ font-size:12px; letter-spacing:4px; }
.button a{ padding:18px 34px; font-size:13px; }
.wall-left, .wall-right{ width:48%; }
.footer-links { flex-direction: column; gap: 8px; }
}
</style>
</head>

<div class="corridor">
    <div class="wall-left"></div>
    <div class="wall-right"></div>
    <div class="depth-left"></div>

</div>

<div class="center">
    <div class="subtitle">PROCEDURAL LIMINAL SYSTEM</div>
    <div class="title">BACKROOMS</div>
    <div class="download">DOWNLOAD GAME</div>
    <div class="button">
        <a href="https://ссылка-на-твое-облако-с-apk.com" target="_blank">DOWNLOAD APK</a>
    </div>
</div>

<div class="bottom">
    <div>REALITY DEGRADATION DETECTED</div>
    <div class="footer-links">
        <a href="terms.html" class="tos-link">TERMS OF SERVICE (EULA)</a>
        <a href="privacy.html" class="tos-link">PRIVACY POLICY</a>
    </div>
</div>

</body>
</html>
